$kind: http-request
name: Add internal note (manager/admin)
url: "{{baseUrl}}/api/work-orders/{{workOrderId}}/comments/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "body": "Customer prefers mornings",
      "is_internal": true
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 201", function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 3000
