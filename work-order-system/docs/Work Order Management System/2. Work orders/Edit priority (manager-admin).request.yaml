$kind: http-request
name: Edit priority (manager/admin)
url: "{{baseUrl}}/api/work-orders/{{workOrderId}}/"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "priority": "URGENT"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 7000
