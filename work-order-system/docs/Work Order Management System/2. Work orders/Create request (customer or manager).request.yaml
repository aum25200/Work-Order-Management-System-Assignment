$kind: http-request
url: "{{baseUrl}}/api/work-orders/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Cooling unit inspection",
      "description": "Unit is not cooling consistently.",
      "priority": "HIGH",
      "location": "Building A, floor 2"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 201", function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 4000
