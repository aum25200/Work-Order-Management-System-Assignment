$kind: http-request
name: "Filter: status=OPEN & priority=HIGH"
url: "{{baseUrl}}/api/work-orders/?status=OPEN&priority=HIGH"
method: GET
queryParams:
  status: OPEN
  priority: HIGH
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 2000
