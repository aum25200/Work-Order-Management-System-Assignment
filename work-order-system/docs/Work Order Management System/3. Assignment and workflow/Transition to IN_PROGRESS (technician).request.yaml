$kind: http-request
url: "{{baseUrl}}/api/work-orders/{{workOrderId}}/transition/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "IN_PROGRESS",
      "note": "Started diagnosis"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 2000
