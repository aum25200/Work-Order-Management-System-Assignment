$kind: http-request
name: Invalid jump OPEN -> CLOSED (expect 400)
description: "Use on an OPEN order (bundled demo order 1). Expected body: Invalid transition from OPEN to CLOSED."
url: "{{baseUrl}}/api/work-orders/{{workOrderId}}/transition/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "CLOSED"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 5000
