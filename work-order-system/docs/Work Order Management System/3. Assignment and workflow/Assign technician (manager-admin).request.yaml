$kind: http-request
name: Assign technician (manager/admin)
url: "{{baseUrl}}/api/work-orders/{{workOrderId}}/assign/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "technician_id": "{{technicianId}}",
      "note": "North region"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 1000
